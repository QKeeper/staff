name: Deploy Staff to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/staff
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm --filter @staff/backend exec prisma generate
            pnpm --filter @staff/backend exec prisma migrate deploy
            pnpm -r build
            pm2 reload staff-backend || pm2 start backend/dist/server.js --name "staff-backend"

